# MMBT Fact-Checking - Experiments Configuration
# =============================================
# This file configures all experiments for reproducibility

# =============================================
# General Settings
# =============================================
seed: 2024
device: cuda
output_dir: outputs

# =============================================
# Datasets
# =============================================
datasets:
  - Snopes
  - Politifact

# =============================================
# Experiments to Run
# =============================================
experiments:
  - white_noise      # Image noise robustness
  - complexity       # Computational complexity analysis
  # - mumin          # Uncomment if you have Twitter credentials

# =============================================
# Experiment 1: White Noise
# =============================================
white_noise:
  enabled: true
  # Valori empirici calibrati su immagini Snopes (PSNR calcolato su 20 immagini campione):
  # eta=0.02 -> PSNR~34.5 dB (leggermente visibile)
  # eta=0.05 -> PSNR~26.8 dB (chiaramente visibile)
  # eta=0.10 -> PSNR~21.0 dB (fortemente degradata)
  # eta=0.20 -> PSNR~15.5 dB (molto pesante)
  noise_levels:
    - 0.0    # Baseline (no noise)
    - 0.02   # Minimo: leggermente visibile (PSNR~34.5 dB)
    - 0.05   # Intermedio 1: chiaramente visibile (PSNR~26.8 dB)
    - 0.10   # Intermedio 2: fortemente degradata (PSNR~21.0 dB)
    - 0.20   # Massimo: molto pesante (PSNR~15.5 dB)
  
  # Dataset per test rumore
  dataset: Snopes
  
  # Metrics to report
  metrics:
    - ndcg_1
    - ndcg_3
    - ndcg_5
    - hit_1
    - hit_3

# =============================================
# Experiment 2: MuMiN Dataset
# =============================================
mumin:
  enabled: false  # Set to true and provide credentials
  size: small     # small, medium, large
  
  # Twitter credentials (set via environment variables)
  # bearer_token: ${TWITTER_BEARER_TOKEN}
  
  splits:
    train: true
    val: true
    test: true

# =============================================
# Experiment 3: Computational Complexity
# =============================================
complexity:
  enabled: true
  
  # Dataset: Snopes (7246 documenti base)
  # Genera versioni espanse rimuovendo parole a caso
  base_dataset: Snopes
  base_doc_count: 1703  # documenti unici nel dataset Snopes
  
  # Fattori di espansione
  expansion_factors:
    - 10    # 7246 * 10 = 72,460 documenti
    - 100   # 7246 * 100 = 724,600 documenti
  
  # Numero di documenti da recuperare
  retrieval_ks:
    - 50
    - 200
  
  # Percentuale parole da rimuovere per generare varianti
  word_removal_ratio: 0.25
  
  # Metrics to measure
  metrics:
    - index_build_time
    - retrieval_time_k50
    - retrieval_time_k200

# =============================================
# Model Configuration
# =============================================
model:
  bert_model: /root/bert_tiny_local
  image_model: resnet152
  hidden_sz: 128
  dropout: 0.4
  num_image_embeds: 3

# =============================================
# Training Configuration
# =============================================
training:
  batch_size: 32
  max_epochs: 100
  learning_rate: 1e-5
  gradient_accumulation_steps: 24
  patience: 10
  warmup: 0.1

# =============================================
# Evaluation Configuration
# =============================================
evaluation:
  top_k_values:
    - 1
    - 3
    - 5
    - 10
    - 50
  
  metrics:
    - ndcg
    - hit_ratio
    - map
    - mrr

# =============================================
# Reproducibility Settings
# =============================================
reproducibility:
  save_every_epoch: false
  save_best_only: true
  deterministic: true
  benchmark: true

# =============================================
# Logging & Output
# =============================================
logging:
  level: INFO
  save_logs: true
  tensorboard: false
  
output:
  save_predictions: true
  save_embeddings: false
  generate_reports: true
